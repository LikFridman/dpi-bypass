# Сборка dpi-bypass.exe на серверах GitHub из исходников этого репозитория.
# - при каждом изменении кода в main: тесты, сборка, свежий dpi-bypass.exe коммитится в корень репозитория
# - при теге vX.Y.Z: ещё и релиз с exe, контрольной суммой и подтверждением происхождения (attestation)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "dpi-bypass.exe"
      - "dpi-bypass.exe.sha256"
      - "dpi-bypass.version"
      - "dpi-bypass.apk"
      - "dpi-bypass.apk.sha256"
      - "docs/**"
      - "go.sum"
      - "update/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Версия
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(sed -n 's/^var version = "\([^"]*\)".*/\1/p' main.go)"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "VMAJ=${MA:-0}" >> "$GITHUB_ENV"
          echo "VMIN=${MI:-0}" >> "$GITHUB_ENV"
          echo "VPAT=${PA:-0}" >> "$GITHUB_ENV"

      - name: Зависимости
        run: go mod tidy

      - name: Проверки и тесты
        run: |
          go vet ./...
          go test ./...

      - name: Ресурсы exe (иконка, манифест, версия)
        shell: bash
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          "$(go env GOPATH)/bin/goversioninfo" -64 -o resource_windows_amd64.syso \
            -ver-major="$VMAJ" -ver-minor="$VMIN" -ver-patch="$VPAT" \
            -product-ver-major="$VMAJ" -product-ver-minor="$VMIN" -product-ver-patch="$VPAT" \
            -file-version="$VERSION" -product-version="$VERSION" \
            res/versioninfo.json

      - name: Сборка
        shell: bash
        run: |
          go build -trimpath -ldflags "-H windowsgui -X main.version=$VERSION" -o dpi-bypass.exe .
          sha256sum dpi-bypass.exe | tee dpi-bypass.exe.sha256
          echo "$VERSION" > dpi-bypass.version

      # настоящая проверка на Windows: winws запускается со всеми нашими параметрами
      - name: Самопроверка (winws на Windows)
        id: selftest
        shell: bash
        run: |
          timeout 900 ./dpi-bypass.exe selftest 2>&1 | tee selftest.txt
          exit ${PIPESTATUS[0]}

      # окно: страница загружается в WebView2, все разделы открываются, снимки экрана для README
      - name: Проверка окна (WebView2) и снимки экрана
        id: uitest
        continue-on-error: true
        shell: bash
        run: |
          timeout 180 ./dpi-bypass.exe uitest; code=$?
          echo "код выхода: $code"
          cat uitest.txt || true
          ls -la docs/screens || true
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpi-bypass-${{ env.VERSION }}
          path: |
            dpi-bypass.exe
            dpi-bypass.exe.sha256
            selftest.txt
            uitest.txt
            docs/screens
            dpi-bypass-data/log.txt

      - name: Положить exe в репозиторий
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dpi-bypass.exe dpi-bypass.exe.sha256 dpi-bypass.version go.mod go.sum
          if [ -d docs/screens ] && ls docs/screens/*.png >/dev/null 2>&1; then git add -f docs/screens/*.png; fi
          if git diff --cached --quiet; then echo "exe не изменился"; exit 0; fi
          git commit -m "Сборка dpi-bypass.exe $VERSION (GitHub Actions) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dpi-bypass.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dpi-bypass.exe
            dpi-bypass.exe.sha256
          generate_release_notes: true

  # ---------------- Android ----------------
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Исходники движков (byedpi, hev-socks5-tunnel)
        run: |
          mkdir -p deps && cd deps
          git clone -q https://github.com/hufrea/byedpi.git byedpi
          git -C byedpi checkout -q e2684772fbda45f2ff4fc220922a010370534216
          git clone -q https://github.com/heiher/hev-socks5-tunnel.git hev
          git -C hev checkout -q 21bb3d77e64ad5a413d4d851b9f4cacf2098cd77
          git -C hev submodule update -q --init --recursive

      - name: Движки (Android NDK)
        run: bash android/native/build.sh deps

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Свой ключ подписи (если задан в секретах)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Сборка APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export APP_VERSION="$(sed -n 's/^var version = "\([^"]*\)".*/\1/p' main.go)"
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk dpi-bypass.apk
          sha256sum dpi-bypass.apk | tee dpi-bypass.apk.sha256

      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверка в эмуляторе Android и снимки экрана
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash android/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpi-bypass-android
          path: |
            dpi-bypass.apk
            dpi-bypass.apk.sha256
            android-selftest.txt
            docs/screens

      - name: Положить APK в репозиторий
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dpi-bypass.apk dpi-bypass.apk.sha256
          if ls docs/screens/android-*.png >/dev/null 2>&1; then git add -f docs/screens/android-*.png; fi
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Сборка dpi-bypass.apk (GitHub Actions) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
